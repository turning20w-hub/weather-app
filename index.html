<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather & Random Lexicon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================
         WEATHER
         ========================== -->

    <main class="weather-app">

        <h1>Weather</h1>

        <div class="weather-cards">

            <section class="weather-card">
                <h2 id="location">Mumbai</h2>

                <p id="temperature"></p>

                <p id="condition">
                    Hourly temperature forecast
                </p>
            </section>


            <section class="weather-card">
                <h2>Aurangabad</h2>

                <p id="aurangabad-temperature"></p>

                <p id="aurangabad-sunrise"></p>

                <p id="aurangabad-sunset"></p>
            </section>

        </div>

        <p id="message"></p>

    </main>


    <!-- ==========================
         RANDOM LEXICON
         ========================== -->

    <main class="lexicon">

        <h1>Random Lexicon</h1>

        <select id="posFilter">
            <option value="">Any part of speech</option>
            <option value="noun">Noun</option>
            <option value="verb">Verb</option>
            <option value="adjective">Adjective</option>
            <option value="adverb">Adverb</option>
        </select>

        <button id="fetchBtn">
            Get a word
        </button>

        <p id="status"></p>

        <p id="error"></p>

        <section id="result" hidden>

            <h2 id="word"></h2>

            <p id="partOfSpeech"></p>

            <p id="definition"></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
