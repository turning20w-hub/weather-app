<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather & Random Lexicon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <section class="weather-card">
    <h2>Mumbai</h2>
    <p id="mumbai-temperature">Loading...</p>
</section>



        

        <!-- RANDOM LEXICON SECTION -->

        <section class="lexicon-section">

            <h1>Random Lexicon</h1>

            <p>
                Fetch a random word and its definition.
            </p>

            <div class="filterRow">

                <label for="posFilter">
                    Part of speech
                </label>

                <select id="posFilter">

                    <option value="">
                        Any
                    </option>

                    <option value="noun">
                        Noun
                    </option>

                    <option value="verb">
                        Verb
                    </option>

                    <option value="adj">
                        Adjective
                    </option>

                </select>

            </div>


            <button id="fetchBtn">
                Get Word
            </button>


            <div id="status" aria-live="polite"></div>


            <section id="result" hidden>

                <h2 id="word"></h2>

                <p id="partOfSpeech"></p>

                <p id="definition"></p>

            </section>


            <div id="error" aria-live="polite"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
